server {
    listen       8080;
    server_name  localhost;

    #access_log  /var/log/nginx/host.access.log  main;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets must 404 on their own instead of silently falling
    # back to index.html, otherwise a missing/stale bundle after a deploy
    # shows up as a confusing JS parse error instead of a clean 404.
    location /assets/ {
        root   /usr/share/nginx/html;
        try_files $uri =404;
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
